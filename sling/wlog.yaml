source: LOCAL
target: "sqlite://storage/seed.sqlite3"

defaults:
  mode: full-refresh
  source_options:
    format: json
    flatten: true

streams:
  "file://sling/seeds/wlog/villages.json":
    object: villages
    target_options:
      table_keys:
        index: [id, village_number]

  "file://sling/seeds/wlog/posts.json":
    object: posts
    target_options:
      table_keys:
        index: [village_id, source, character]

  "file://sling/seeds/wlog/character_sets.json":
    object: character_sets

  "file://sling/seeds/wlog/avatars.json":
    object: avatars
    target_options:
      table_keys:
        index: [name, set_id]
